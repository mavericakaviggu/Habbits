# Local Development Configuration
# This profile is used for local development only
# To use: mvn spring-boot:run -Dspring-boot.run.profiles=local

# H2 Database Configuration (local file-based database)
spring.datasource.url=jdbc:h2:file:./data/habitsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# CORS Configuration (allow React frontend from localhost)
cors.allowed.origins=http://localhost:3000,http://192.168.1.10:3000,http://127.0.0.1:3000
